<div id="app"><div style="text-align:center;padding:60px 20px;direction:rtl;font-family:sans-serif;color:#666">טוען...</div></div>

<script>
'use strict';
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/shifts-sw.js').catch(e=>console.log('SW registration failed:',e))});}

const HMON=['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const HDAY=['א׳','ב׳','ג׳','ד׳','ה׳','ו׳','ש׳'];
const HDAYF=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const STMAP={pending:'ממתין',approved:'מאושר',done:'בוצע',cancelled:'בוטל'};
const STCLS={pending:'st-p',approved:'st-a',done:'st-d',cancelled:'st-c'};

let db,evs=[],selDate=todayS(),vm=new Date(),wkStart=getWeekStart(new Date());
let view='home',showForm=false,editId=null,fType='work',confirmCb=null;

async function initIDB(){
  return new Promise((ok,err)=>{
    const req=indexedDB.open('shifts_db',1);
    req.onerror=()=>err(req.error);
    req.onsuccess=()=>{db=req.result;ldData();render()};
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains('events')){
        const s=d.createObjectStore('events',{keyPath:'id'});
        s.createIndex('date','date','');
      }
    };
  });
}
function ldData(){
  if(!db)return;
  const t=db.transaction('events','readonly'),s=t.objectStore('events'),r=s.getAll();
  r.onsuccess=()=>{evs=r.result.filter(e=>e&&e.date);render()};
}
function svData(ev){
  if(!db)return Promise.resolve();
  return new Promise((ok,err)=>{
    const t=db.transaction('events','readwrite'),s=t.objectStore('events');
    const r=ev.id?s.put(ev):s.add(ev);
    r.onsuccess=()=>ok();r.onerror=()=>err(r.error);
  });
}
function delData(id){
  if(!db)return Promise.resolve();
  return new Promise((ok,err)=>{
    const t=db.transaction('events','readwrite'),s=t.objectStore('events');
    const r=s.delete(id);
    r.onsuccess=()=>ok();r.onerror=()=>err(r.error);
  });
}

function todayS(){return fmt(new Date())}
function fmt(d){if(!d||isNaN(d.getTime())){var n=new Date();return n.getFullYear()+'-'+pad(n.getMonth()+1)+'-'+pad(n.getDate())}return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pad(n){return n<10?'0'+n:''+n}
function pD(s){if(!s||typeof s!=='string')return new Date();const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])}
function addDays(d,n){const r=new Date(d);r.setDate(r.getDate()+n);return r}
function getWeekStart(d){const r=new Date(d);r.setDate(r.getDate()-r.getDay());return r}
function diffDays(a,b){if(!a||!b)return 999;return Math.round((pD(a)-pD(b))/(864e5))}

window.setView=function(v){view=v;render()};
window.prevM=function(){vm.setMonth(vm.getMonth()-1);render()};
window.nextM=function(){vm.setMonth(vm.getMonth()+1);render()};
window.prevW=function(){wkStart=addDays(wkStart,-7);render()};
window.nextW=function(){wkStart=addDays(wkStart,7);render()};
window.goToday=function(){vm=new Date();wkStart=getWeekStart(new Date());selDate=todayS();render()};
window.selDay=function(d){selDate=d;view='month';render()};
window.openForm=function(id){
  if(id){const ev=evs.find(e=>e.id===id);if(ev){editId=id;fType=ev.type||'work'}}
  else{editId=null;fType='work'}
  showForm=true;render();
};
window.closeForm=function(){showForm=false;editId=null;render()};
window.setFType=function(t){fType=t;render()};
window.fillField=function(fid,val){const el=document.getElementById(fid);if(el)el.value=val};
window.saveEv=function(){
  const g=s=>document.getElementById(s)?.value?.trim()||'';
  let data;
  if(fType==='work'){
    data={type:'work',branch:g('f_branch'),date:g('f_date'),
      startTime:g('f_from'),endTime:g('f_to'),requestedBy:g('f_who'),
      approvedBy:g('f_appby'),status:g('f_status')||'pending',notes:g('f_notes')};
    if(!data.branch||!data.date){alert('נא למלא סניף ותאריך');return}
  }else{
    data={type:'personal',title:g('f_title'),date:g('f_date'),
      time:g('f_time'),location:g('f_loc'),notes:g('f_notes')};
    if(!data.title||!data.date){alert('נא למלא כותרת ותאריך');return}
  }
  if(editId){data.id=editId;svData(data).then(()=>{evs=evs.map(e=>e.id===editId?data:e);showForm=false;editId=null;render()})}
  else{data.id='e_'+Date.now()+'_'+Math.random().toString(36).substr(2,5);svData(data).then(()=>{evs.push(data);showForm=false;editId=null;render()})}
};
window.askDel=function(id){confirmCb=()=>{delData(id).then(()=>{evs=evs.filter(e=>e.id!==id);confirmCb=null;showForm=false;editId=null;render()})};render()};
window.confirmY=function(){if(confirmCb)confirmCb()};
window.confirmN=function(){confirmCb=null;render()};
window.cycleStatus=function(id,e){
  e.stopPropagation();const ev=evs.find(x=>x.id===id);if(!ev)return;
  const order=['pending','approved','done','cancelled'];
  const ns=order[(order.indexOf(ev.status||'pending')+1)%order.length];
  const d={...ev,status:ns};
  svData(d).then(()=>{evs=evs.map(x=>x.id===id?d:x);render()});
};

function evsFor(d){return evs.filter(e=>e.date===d)}
function sortEvs(arr){return arr.sort((a,b)=>a.date.localeCompare(b.date)||(a.startTime||a.time||'').localeCompare(b.startTime||b.time||''))}
function hasDots(d){const de=evsFor(d);return{w:de.some(e=>e.type==='work'),p:de.some(e=>e.type==='personal')}}
function fmtD(s){const d=pD(s);return d.getDate()+' '+HMON[d.getMonth()]}
function fmtDF(s){return 'יום '+HDAYF[pD(s).getDay()]+', '+fmtD(s)}
function monthDays(y,m){return new Date(y,m+1,0).getDate()}
function firstDay(y,m){return new Date(y,m,1).getDay()}
function uniqueVals(field){const s=new Set();evs.forEach(e=>{if(e[field])s.add(e[field])});return[...s]}

function render(){
  const app=document.getElementById('app');
  const td=todayS(),tdn=pD(td);
  let h='';
  h+=`<div class="appbar"><div class="row"><h1>לוח משמרות</h1>
    <span class="sbg on">● מקומי</span></div>
    <div class="sub">${fmtDF(td)}</div></div>`;
  h+=`<div class="main">`;
  if(view==='home') h+=renderHome(td);
  else if(view==='week') h+=renderWeek(td);
  else if(view==='month') h+=renderMonth(td);
  h+=`</div>`;
  h+=`<button class="fab" onclick="openForm()">+</button>`;
  h+=renderNav();
  if(showForm) h+=renderFormHTML();
  if(confirmCb) h+=`<div class="cfrm" onclick="confirmN()"><div class="cbox" onclick="event.stopPropagation()">
    <p>למחוק את האירוע הזה?</p><div class="cbtn">
    <button class="cy" onclick="confirmY()">מחק</button>
    <button class="cn" onclick="confirmN()">ביטול</button></div></div></div>`;
  app.innerHTML=h;
}

function renderHome(td){
  let h='';
  const cm=pD(td).getMonth(),cy=pD(td).getFullYear();
  const monthEvs=evs.filter(e=>e.type==='work'&&pD(e.date).getMonth()===cm&&pD(e.date).getFullYear()===cy);
  const pendingEvs=evs.filter(e=>e.type==='work'&&(e.status||'pending')==='pending'&&e.date>=td);
  const weekEvs=evs.filter(e=>{const df=diffDays(e.date,td);return df>=0&&df<7});
  h+=`<div class="stats">
    <div class="stat"><div class="sv wrk">${monthEvs.length}</div><div class="sl">משמרות החודש</div></div>
    <div class="stat"><div class="sv pnd">${pendingEvs.length}</div><div class="sl">ממתינים לאישור</div></div>
    <div class="stat"><div class="sv pri">${weekEvs.length}</div><div class="sl">השבוע</div></div>
  </div>`;
  const todayEvs=sortEvs(evsFor(td));
  h+=`<div class="sec"><div class="sec-h">היום`;
  if(todayEvs.length)h+=`<span class="cnt">${todayEvs.length}</span>`;
  h+=`</div>`;
  if(todayEvs.length===0){
    h+=`<div class="empty"><div class="eico">☀️</div>אין אירועים להיום — יום חופשי!</div>`;
  }else{
    for(const ev of todayEvs) h+=renderCard(ev);
  }
  h+=`</div>`;
  if(pendingEvs.length){
    h+=`<div class="sec"><div class="sec-h">ממתינים לאישור <span class="cnt">${pendingEvs.length}</span></div>`;
    for(const ev of sortEvs(pendingEvs).slice(0,5)) h+=renderCard(ev,true);
    h+=`</div>`;
  }
  const upEvs=sortEvs(evs.filter(e=>e.date>td)).slice(0,5);
  if(upEvs.length){
    h+=`<div class="sec"><div class="sec-h">קרוב</div>`;
    for(const ev of upEvs) h+=renderCard(ev,true);
    h+=`</div>`;
  }
  return h;
}

function renderWeek(td){
  let h='';
  const ws=wkStart,we=addDays(ws,6);
  h+=`<div class="wknav"><button onclick="nextW()">›</button>
    <span class="wkl">${pD(fmt(ws)).getDate()}-${pD(fmt(we)).getDate()} ${HMON[pD(fmt(ws)).getMonth()]} ${pD(fmt(ws)).getFullYear()}</span>
    <button onclick="prevW()">‹</button></div>`;
  for(let i=0;i<7;i++){
    const d=addDays(ws,i),ds=fmt(d);
    const isT=ds===td;
    const de=sortEvs(evsFor(ds));
    h+=`<div class="wkday"><div class="dinfo${isT?' today':''}">
      <div class="dname">${HDAYF[d.getDay()]}</div>
      <div class="dnum">${d.getDate()}</div></div><div class="devs">`;
    if(de.length===0){
      h+=`<div class="wkfree">—</div>`;
    }else{
      for(const ev of de){
        const isW=ev.type==='work';
        const name=isW?(ev.branch||'משמרת'):(ev.title||'אירוע');
        const time=isW?(ev.startTime||''):(ev.time||'');
        const st=isW?(ev.status||'pending'):'';
        h+=`<div class="wkpill${isW?'':' pr'}" onclick="openForm('${ev.id}')">
          <span class="pname">${name}${st?` <span class="stb ${STCLS[st]}" onclick="cycleStatus('${ev.id}',event)">${STMAP[st]}</span>`:''}</span>
          ${time?`<span class="ptime">${time}</span>`:''}
        </div>`;
      }
    }
    h+=`</div></div>`;
  }
  return h;
}

function renderMonth(td){
  let h='';
  const y=vm.getFullYear(),m=vm.getMonth();
  h+=`<div class="cnav"><button onclick="nextM()">›</button>
    <span class="ml">${HMON[m]} ${y}</span>
    <button onclick="prevM()">‹</button></div>`;
  h+=`<div class="cgrid">`;
  for(const dn of HDAY) h+=`<div class="dn">${dn}</div>`;
  const fd=firstDay(y,m),md=monthDays(y,m);
  const pmd=monthDays(y,m===0?11:m-1);
  for(let i=0;i<fd;i++){
    const d=pmd-fd+1+i,pm=m===0?11:m-1,py=m===0?y-1:y;
    h+=`<div class="dc om" onclick="selDay('${fmt(new Date(py,pm,d))}')">${d}</div>`;
  }
  for(let d=1;d<=md;d++){
    const ds=fmt(new Date(y,m,d)),isT=ds===td,isS=ds===selDate;
    const dots=hasDots(ds);
    let cls='dc';if(isT)cls+=' td';if(isS)cls+=' sel';
    h+=`<div class="${cls}" onclick="selDay('${ds}')">${d}`;
    if(dots.w||dots.p){h+=`<div class="dots">${dots.w?'<span class="dw"></span>':''}${dots.p?'<span class="dp"></span>':''}</div>`}
    h+=`</div>`;
  }
  const rem=(fd+md)%7;
  if(rem>0)for(let i=1;i<=7-rem;i++){
    const nm=m===11?0:m+1,ny=m===11?y+1:y;
    h+=`<div class="dc om" onclick="selDay('${fmt(new Date(ny,nm,i))}')">${i}</div>`;
  }
  h+=`</div>`;
  const de=sortEvs(evsFor(selDate));
  h+=`<div class="dsec">${fmtDF(selDate)}${selDate===td?' (היום)':''}</div>`;
  if(de.length===0) h+=`<div class="empty">אין אירועים</div>`;
  else for(const ev of de) h+=renderCard(ev);
  return h;
}

function renderCard(ev,showDate){
  const isW=ev.type==='work';
  const name=isW?(ev.branch||'משמרת'):(ev.title||'אירוע');
  const time=isW?(ev.startTime?(ev.startTime+(ev.endTime?' - '+ev.endTime:'')):''):(ev.time||'');
  const ico=isW?'🏪':'📌';
  let h=`<div class="ecard ${isW?'wk':'pr'}" onclick="openForm('${ev.id}')">
    <div class="eicon ${isW?'wk':'pr'}">${ico}</div><div class="ebody">
    <div class="etop"><span class="ename">${name}</span>
    ${time?`<span class="etime">${time}</span>`:''}
    </div><div class="emeta">`;
  if(showDate) h+=`<span>${fmtDF(ev.date)}</span>`;
  if(isW){
    if(ev.requestedBy) h+=`<span>ביקש: ${ev.requestedBy}</span>`;
    if(ev.approvedBy) h+=`<span>אישור: ${ev.approvedBy}</span>`;
    const st=ev.status||'pending';
    h+=`<span class="stb ${STCLS[st]}" onclick="cycleStatus('${ev.id}',event)">${STMAP[st]}</span>`;
  }else{
    if(ev.location) h+=`<span>📍 ${ev.location}</span>`;
  }
  h+=`</div>`;
  if(ev.notes) h+=`<div class="enote">${ev.notes}</div>`;
  h+=`</div></div>`;
  return h;
}

function renderNav(){
  const ic=(p,a)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${a?2.2:1.8}" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
  return`<div class="bnav">
    <button class="${view==='home'?'act':''}" onclick="setView('home')">
      ${ic('<path d="M3 12l9-8 9 8"/><path d="M5 10v10a1 1 0 001 1h3v-6h6v6h3a1 1 0 001-1V10"/>',view==='home')}ראשי</button>
    <button class="${view==='week'?'act':''}" onclick="setView('week')">
      ${ic('<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="10" y1="4" x2="10" y2="20"/>',view==='week')}שבוע</button>
    <button class="${view==='month'?'act':''}" onclick="setView('month')">
      ${ic('<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',view==='month')}חודש</button>
  </div>`;
}

function renderFormHTML(){
  const ev=editId?evs.find(e=>e.id===editId):null;
  const isW=fType==='work';
  let h=`<div class="fov"><div class="fhdr"><h2>${editId?'עריכת אירוע':'אירוע חדש'}</h2>
    <button class="fcl" onclick="closeForm()">&times;</button></div><div class="fpad">`;
  h+=`<div class="ttog">
    <button class="${isW?'aw':''}" onclick="setFType('work')"><span class="tico">🏪</span>משמרת עבודה</button>
    <button class="${!isW?'ap':''}" onclick="setFType('personal')"><span class="tico">📌</span>אישי / תור</button></div>`;
  if(isW){
    const branches=uniqueVals('branch'),people=uniqueVals('requestedBy'),mgrs=uniqueVals('approvedBy');
    h+=`<div class="fg"><label>סניף</label>
      <input id="f_branch" placeholder="שם הסניף" value="${ev?.branch||''}">`;
    if(branches.length)h+=`<div class="chips">${branches.map(b=>`<button class="chip" onclick="fillField('f_branch','${b}')">${b}</button>`).join('')}</div>`;
    h+=`</div>`;
    h+=`<div class="fg"><label>תאריך</label><input id="f_date" type="date" value="${ev?.date||selDate}"></div>`;
    h+=`<div class="frow">
      <div class="fg"><label>משעה</label><input id="f_from" type="time" value="${ev?.startTime||''}"></div>
      <div class="fg"><label>עד שעה</label><input id="f_to" type="time" value="${ev?.endTime||''}"></div></div>`;
    h+=`<div class="fg"><label>מי ביקש</label><input id="f_who" placeholder="שם העובד" value="${ev?.requestedBy||''}">`;
    if(people.length)h+=`<div class="chips">${people.map(p=>`<button class="chip" onclick="fillField('f_who','${p}')">${p}</button>`).join('')}</div>`;
    h+=`</div>`;
    h+=`<div class="frow">
      <div class="fg"><label>מאושר ע"י</label><input id="f_appby" placeholder="שם המנהל" value="${ev?.approvedBy||''}">
      ${mgrs.length?`<div class="chips">${mgrs.map(m=>`<button class="chip" onclick="fillField('f_appby','${m}')">${m}</button>`).join('')}</div>`:''}
      </div>
      <div class="fg"><label>סטטוס</label><select id="f_status">
        <option value="pending" ${(ev?.status||'pending')==='pending'?'selected':''}>ממתין</option>
        <option value="approved" ${ev?.status==='approved'?'selected':''}>מאושר</option>
        <option value="done" ${ev?.status==='done'?'selected':''}>בוצע</option>
        <option value="cancelled" ${ev?.status==='cancelled'?'selected':''}>בוטל</option>
      </select></div></div>`;
  }else{
    h+=`<div class="fg"><label>כותרת</label><input id="f_title" placeholder="למשל: תור לרופא, פגישה..." value="${ev?.title||''}"></div>`;
    h+=`<div class="frow">
      <div class="fg"><label>תאריך</label><input id="f_date" type="date" value="${ev?.date||selDate}"></div>
      <div class="fg"><label>שעה</label><input id="f_time" type="time" value="${ev?.time||''}"></div></div>`;
    h+=`<div class="fg"><label>מיקום</label><input id="f_loc" placeholder="לא חובה" value="${ev?.location||''}"></div>`;
  }
  h+=`<div class="fg"><label>הערות</label><textarea id="f_notes" placeholder="לא חובה">${ev?.notes||''}</textarea></div>`;
  h+=`<button class="bsub ${isW?'wk':'pr'}" onclick="saveEv()">${editId?'שמור שינויים':'הוסף אירוע'}</button>`;
  if(editId)h+=`<button class="bdel" onclick="askDel('${editId}')">מחק אירוע</button>`;
  h+=`</div></div>`;
  return h;
}

initIDB().catch(e=>{console.log('IDB error:',e);ldL();render()});
</script>
