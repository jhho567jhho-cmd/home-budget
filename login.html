<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">
    <title>התחברות - Home Budget</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --secondary: #1e40af;
            --accent: #f59e0b;
            --text: #1f2937;
            --light: #f9fafb;
            --border: #e5e7eb;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            font-size: 16px;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
        }

        .auth-card {
            background: white;
            border-radius: 0.75rem;
            padding: 2rem 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .auth-header h1 {
            font-size: clamp(1.5rem, 5vw, 2rem);
            color: var(--text);
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: #6b7280;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text);
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--border);
            border-radius: 0.5rem;
            font-size: 1rem;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--primary);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .forgot-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: clamp(1rem, 3vw, 1.1rem);
            font-weight: 600;
            cursor: pointer;
            min-height: 48px;
            transition: background-color 0.3s ease;
        }

        .submit-btn:hover {
            background-color: var(--secondary);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 2rem 0;
            gap: 1rem;
            color: #d1d5db;
            font-size: 0.9rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: var(--border);
        }

        .social-buttons {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .social-btn {
            flex: 1;
            padding: 0.75rem;
            border: 2px solid var(--border);
            background: white;
            border-radius: 0.5rem;
            font-size: 1.25rem;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-btn:hover {
            border-color: var(--primary);
            background-color: #f0f9ff;
        }

        .auth-footer {
            text-align: center;
            margin-top: 2rem;
            color: #6b7280;
        }

        .auth-footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            border-bottom: 2px solid var(--border);
        }

        .tab {
            flex: 1;
            padding: 0.75rem;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-weight: 600;
            color: #6b7280;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            margin-bottom: -2px;
        }

        .tab.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @media (max-width: 768px) {
            .auth-card {
                padding: 1.5rem 1rem;
            }

            .auth-header {
                margin-bottom: 1.5rem;
            }

            body {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">💰</div>
                <h1>Home Budget</h1>
                <p>ניהול תקציב חכם</p>
            </div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('login')">התחברות</button>
                <button class="tab" onclick="switchTab('signup')">הרשמה</button>
            </div>

            <!-- Login Tab -->
            <div id="login" class="tab-content active">
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="email">כתובת אימייל</label>
                        <input type="email" id="email" placeholder="example@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">סיסמה</label>
                        <input type="password" id="password" placeholder="הזן סיסמה" required>
                    </div>

                    <div class="remember-forgot">
                        <label class="checkbox">
                            <input type="checkbox">
                            <span>זכור אותי</span>
                        </label>
                        <a href="#" class="forgot-link">שכחת סיסמה?</a>
                    </div>

                    <button type="submit" class="submit-btn">התחברות</button>
                </form>

                <div class="divider">או</div>

                <div class="social-buttons">
                    <button class="social-btn" onclick="alert('התחברות עם Google')">🔵</button>
                    <button class="social-btn" onclick="alert('התחברות עם Facebook')">👤</button>
                    <button class="social-btn" onclick="alert('התחברות עם Apple')">🍎</button>
                </div>
            </div>

            <!-- Signup Tab -->
            <div id="signup" class="tab-content">
                <form onsubmit="handleSignup(event)">
                    <div class="form-group">
                        <label for="name">שם מלא</label>
                        <input type="text" id="name" placeholder="הזן שם מלא" required>
                    </div>

                    <div class="form-group">
                        <label for="signup-email">כתובת אימייל</label>
                        <input type="email" id="signup-email" placeholder="example@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="signup-password">סיסמה</label>
                        <input type="password" id="signup-password" placeholder="לפחות 8 תווים" required>
                    </div>

                    <div class="form-group">
                        <label for="confirm-password">אישור סיסמה</label>
                        <input type="password" id="confirm-password" placeholder="אשר סיסמה" required>
                    </div>

                    <div class="checkbox" style="margin-bottom: 2rem;">
                        <input type="checkbox" required>
                        <span style="font-size: 0.9rem;">אני מסכים ל<a href="#" class="forgot-link" style="display: inline;">תנאי השימוש</a></span>
                    </div>

                    <button type="submit" class="submit-btn">צור חשבון</button>
                </form>
            </div>

            <div class="auth-footer">
                <p>חדש כאן? <a href="#" onclick="switchTab('signup'); return false;">צור חשבון</a></p>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            // Hide all tabs
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));

            // Show selected tab
            document.getElementById(tab).classList.add('active');
            event.target.classList.add('active');
        }

        function handleLogin(e) {
            e.preventDefault();
            alert('התחברות הצליחה! ✅');
            // window.location.href = 'dashboard.html';
        }

        function handleSignup(e) {
            e.preventDefault();
            alert('הרשמה הצליחה! ✅');
            // window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
